[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "symsoil-api"
version = "0.4.0"
description = "Local-first synthetic R0 community workbench API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "argon2-cffi>=23,<27", "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
symsoil = "symsoil_api.cli:main"

[tool.setuptools.packages.find]
include = ["symsoil_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
